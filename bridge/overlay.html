<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #fade { position: fixed; inset: 0; display: none; }
  #dot { position: fixed; left: 0; top: 0; width: 20px; height: 20px; border-radius: 50%; display: none; border: 2px solid rgba(255,255,255,.9); }
  #black { position: fixed; inset: 0; background: #000; display: none; }
</style>
</head>
<body>
<div id="fade"></div>
<div id="dot"></div>
<div id="black"></div>
<script src="overlay.js"></script>
</body>
</html>
